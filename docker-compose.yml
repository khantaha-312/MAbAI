services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: mip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mip_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mip_password}
      POSTGRES_DB: ${POSTGRES_DB:-mip_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - ./db/init/001_extensions.sql:/docker-entrypoint-initdb.d/999_extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mip_user} -d ${POSTGRES_DB:-mip_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mip-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
